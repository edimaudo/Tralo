<nav class="nav-header">
    <div class="logo-small">TRALO</div>
    <div class="nav-links">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('dashboard') }}" class="active">Monitor</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('help') }}">Governance</a>
    </div>
</nav>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <label>Total Tracks</label>
            <div class="value">{{ portfolio|length }}</div>
        </div>
        <div class="stat-card critical">
            <label>Off-Track Exposure</label>
            <div class="value">${{ crit_val }}</div>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>Borrower</th>
                <th>Exposure</th>
                <th>Sector</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for loan in portfolio %}
            <tr>
                <td><strong>{{ loan.borrower }}</strong><br><small>{{ loan.id }}</small></td>
                <td>${{ "{:,.0f}".format(loan.exposure) }}</td>
                <td>{{ loan.sector }}</td>
                <td>
                    <span class="pill status-{{ loan.risk.color }}">
                        {{ loan.risk.level }}
                    </span>
                </td>
                <td><button class="action-btn">{{ loan.risk.action }}</button></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
