<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Tralo | Milestone History</title>
</head>
<body>
    <nav class="nav-header">
        <div class="logo-small">TRALO</div>
        <div class="nav-links"><a href="{{ url_for('dashboard') }}">Back to Monitor</a></div>
    </nav>
    <div class="container">
        <h1>Global Milestone History</h1>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Borrower</th>
                    <th>Event</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in history %}
                <tr>
                    <td>{{ entry.date }}</td>
                    <td><strong>{{ entry.borrower }}</strong><br><small>{{ entry.loan_id }}</small></td>
                    <td>{{ entry.event }}</td>
                    <td>
                        {% set color = 'danger' if entry.status == 'OFF-TRACK' else 'success' %}
                        <span class="pill status-{{ color }}">{{ entry.status }}</span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
